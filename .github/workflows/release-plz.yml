name: release-plz

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - v82-patched
      - devel

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Commit Cargo.lock if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Cargo.lock
          git diff --cached --quiet || git commit -m "chore: update Cargo.lock"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run release-plz (only for *-rwasm crates)
        run: |
          packages=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].name' | grep -- '-rwasm' | tr '\n' ' ')
          echo "Detected rwasm packages:"
          echo "$packages"
          if [ -z "$packages" ]; then
            echo "No -rwasm packages found. Skipping release-plz."
            exit 0
          fi
          release-plz release-pr --packages $packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz (publish crates + GitHub release)
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
