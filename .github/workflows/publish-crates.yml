name: Publish to crates.io
on:
  workflow_dispatch:
    inputs:
      crates:
        description: "Space-separated list of crates to publish (optional — publish all if empty)"
        required: false
        type: string
jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-release
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          crates="${{ github.event.inputs.crates }}"
          if [ -z "$crates" ]; then
            echo "No crates specified — publishing entire workspace"
            cargo release publish \
              --workspace \
              --exclude revme \
              --exclude custom_precompile_journal \
              --no-verify \
              --no-confirm \
              --execute
          else
            for crate in $crates; do
              echo "Publishing crate: $crate"
              cargo release publish \
                --no-verify \
                --no-confirm \
                --execute \
                "$crate"
            done
          fi