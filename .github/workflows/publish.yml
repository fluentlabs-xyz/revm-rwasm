name: Publish to crates.io

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (verify without publishing)"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: [ self-hosted, linux ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Publish to crates.io
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p revm-rwasm-primitives
          cargo search revm-rwasm-primitives | head
          cargo publish -p revm-rwasm-bytecode
          cargo search revm-rwasm-bytecode | head
          cargo publish -p revm-rwasm-precompile
          cargo search revm-rwasm-precompile | head
          cargo publish -p revm-rwasm-state
          cargo search revm-rwasm-state | head
          cargo publish -p revm-rwasm-database-interface
          cargo search revm-rwasm-database-interface | head
          cargo publish -p revm-rwasm-context-interface
          cargo search revm-rwasm-context-interface | head
          cargo publish -p revm-rwasm-database
          cargo search revm-rwasm-database | head
          cargo publish -p revm-rwasm-context
          cargo search revm-rwasm-context | head
          cargo publish -p revm-rwasm-interpreter
          cargo search revm-rwasm-interpreter | head
          cargo publish -p revm-rwasm-handler
          cargo search revm-rwasm-handler | head
          cargo publish -p revm-rwasm-statetest-types
          cargo search revm-rwasm-statetest-types | head
          cargo publish -p revm-rwasm-inspector
          cargo search revm-rwasm-inspector | head
          cargo publish -p revm-rwasm
          cargo search revm | head
          cargo publish -p op-revm
          cargo search op-revm | head