name: Publish to crates.io

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (verify without publishing)"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: [ self-hosted, linux ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Publish to crates.io
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p revm-primitives
          cargo search revm-primitives | head
          cargo publish -p revm-bytecode
          cargo search revm-bytecode | head
          cargo publish -p revm-precompile
          cargo search revm-precompile | head
          cargo publish -p revm-state
          cargo search revm-state | head
          cargo publish -p revm-database-interface
          cargo search revm-database-interface | head
          cargo publish -p revm-context-interface
          cargo search revm-context-interface | head
          cargo publish -p revm-database
          cargo search revm-database | head
          cargo publish -p revm-context
          cargo search revm-context | head
          cargo publish -p revm-interpreter
          cargo search revm-interpreter | head
          cargo publish -p revm-handler
          cargo search revm-handler | head
          cargo publish -p revm-statetest-types
          cargo search revm-statetest-types | head
          cargo publish -p revm-inspector
          cargo search revm-inspector | head
          cargo publish -p revm
          cargo search revm | head
          cargo publish -p op-revm
          cargo search op-revm | head
          cargo publish -p revme
          cargo search revme | head
          cargo publish -p revm-ee-tests
          cargo search revm-ee-tests | head